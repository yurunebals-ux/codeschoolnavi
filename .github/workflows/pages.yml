name: deploy-pages

# 無料・無制限のデプロイ先（GitHub Pages）。Netlifyのクレジット上限（1デプロイ=15クレジット／
# Personalプラン1,000クレジット=月66デプロイ）に依存せず、毎日の自動公開を止めないための本番デプロイ経路。

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  # daily-content-cycle が記事をコミットしても、その push は既定の GITHUB_TOKEN で行われる。
  # GitHub は再帰を防ぐため、このトークンによる push では workflow を起動しない。
  # そのため push トリガーだけだと、書けた記事がリポジトリに入るだけでサイトに出ない
  # （実際に 2026-07-26 の cron で 9 本目が公開されず、本番が 404 のままだった）。
  # workflow_run はトークンに関係なく発火するので、こちらで拾う。
  workflow_run:
    workflows: ["daily-content-cycle", "site-screenshots", "regen-articles", "news-column", "news-hot", "x-comment"]
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # workflow_run 経由のときは、daily 側が成功した回だけデプロイする。
    # types: [completed] は失敗・中止でも発火するため、ここで絞らないと
    # 記事が書けなかった日に古い内容で上書きデプロイしてしまう。
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Install site deps
        run: npm install
        working-directory: site
      - name: Build site
        run: npm run build
        working-directory: site
        env:
          SITE_URL: "https://codeschoolnavi.com"
          SITE_TITLE: "コードスクールナビ"
      # 記事ごとの OGP 画像（1200x675 PNG）。アイキャッチのSVGを PNG にして og:image を差し替える（2026-09-23）
      # 日本語の描画に Noto Sans CJK が要る。失敗しても共通画像のままデプロイは続ける
      - name: Japanese fonts for OG images
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk >/dev/null || true
      - name: OG images
        run: node scripts/og.mjs || echo "og skipped"
        working-directory: site
        env:
          SITE_URL: "https://codeschoolnavi.com"
      - name: Custom domain (CNAME)
        run: echo "codeschoolnavi.com" > site/dist/CNAME
      - name: Guard against empty build
        run: test -f site/dist/index.html && test -d site/dist/blog
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # 新着記事を Bluesky に自動投稿（2026-09-23 アクセス特化）。デプロイ完了後＝本番に記事とOGP画像が出てから投稿する。
  # 重複はアカウントの過去投稿と突き合わせて防ぐ。アプリパスワードが未登録なら何もしない。失敗してもデプロイは成功扱い
  social:
    needs: deploy
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Post new articles to Bluesky
        run: node site/scripts/bsky.mjs
        env:
          BSKY_HANDLE: "codeschoolnavi.bsky.social"
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
          SITE_URL: "https://codeschoolnavi.com"
