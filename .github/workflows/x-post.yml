name: x-post

# 新着記事を X に自動投稿（2026-09-26 オーナー決定: リンク付きを1日1本、月31本まで。当初3本→同日1本に変更）。
# 1回の実行で最大1本。投稿した記事は data/x-posted.json に記録してコミットする（重複防止と月の上限の数え方）。
# 必要な GitHub Secrets: X_API_KEY, X_API_SECRET, X_ACCESS_TOKEN, X_ACCESS_SECRET（未登録なら何もしない）
# 2026-09-26 オーナー判断「一旦これで」: X は API（有料）ではなく、/x-today/ のワンタップ投稿（手動・無料）で運用する。
# そのため定期実行は止めてある。API で自動化に戻すときは、下の schedule の行のコメントを外し、Secrets を登録する。
on:
  # schedule:
  #   - cron: "15 11 * * *"   # 20:15 JST
  workflow_dispatch:
    inputs:
      dry:
        description: "投稿せずに本文だけ確認する"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: x-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    env:
      X_API_KEY: ${{ secrets.X_API_KEY }}
      X_API_SECRET: ${{ secrets.X_API_SECRET }}
      X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
      X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
      SITE_URL: "https://codeschoolnavi.com"
      X_MONTHLY_MAX: "31"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: 投稿
        run: node site/scripts/xpost.mjs ${{ inputs.dry && '--dry' || '' }}
      - name: 記録をコミット
        if: ${{ !inputs.dry }}
        run: |
          git diff --quiet data/x-posted.json && { echo "記録の変更なし"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/x-posted.json
          git commit -m "x: 投稿を記録"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && break; sleep 5; done
