name: news-hot

# 速報: 1日3回（07:00 / 13:00 / 19:00 JST）反応の多いAIニュースを最大2本、まとめ風に書く。前回から5時間未満なら休む。
on:
  schedule:
    - cron: "0 22 * * *"
    - cron: "0 4 * * *"
    - cron: "0 10 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  news:
    runs-on: ubuntu-latest
    concurrency:
      group: content-cycle
      cancel-in-progress: false
    env:
      LLM_PROVIDER: "openai"
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_MODEL: "gpt-4.1-mini"
      SITE_URL: "https://codeschoolnavi.com"
      SITE_NAME: "コードスクールナビ"
      SITE_AUTHOR: "編集部"
      SITE_NICHE: "programming-schools"
      MIN_WORDS: "4200"
      INDEXNOW_KEY: "a77cf03e731e2c8ffbef06cf3fd92398"
      PUBLISH_COMMIT: "1"
      PUBLISH_PUSH: "1"
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: npm install
      - name: Configure git
        run: |
          git config user.name "content-bot"
          git config user.email "bot@users.noreply.github.com"
      - name: Pick news, write, check, publish
        run: |
          set -o pipefail
          npx tsx src/pipeline/news.ts --hot --min-hours=5 --max=2 | tee news.log
          # ニュースが拾えなかった日は何も書かない（generate は次のキュー＝比較記事を書いてしまうため）
          N=$(grep -c "キュー投入" news.log || true)
          [ "$N" -gt 0 ] || { echo "ニュース無し。終了"; exit 0; }
          npx tsx src/pipeline/generate.ts "$N"
          npx tsx src/pipeline/quality.ts
          npx tsx src/pipeline/publish.ts
